<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Frontier night sky review</title>
<style>body{margin:0;background:#030813;color:#dbe9ff;font:14px system-ui}canvas{display:block}aside{position:absolute;left:20px;top:20px;background:#081224cc;padding:16px;border-radius:12px;max-width:330px}button{background:#233650;color:#dbe9ff;border:0;padding:8px;margin:4px;border-radius:5px}label{display:block;margin-top:10px}input{width:100%}p{line-height:1.5}</style></head>
<body><aside><b>Frontier · celestial sky</b><p>Drag to look around. Scroll to zoom in on the planets. This uses the game's actual sky renderer.</p><button id="night">Midnight</button><button id="dusk">Dusk</button><button id="day">Noon</button><button id="wide">Wide view</button><button id="planet">Ringed planet</button><button id="blue">Blue planet</button><button id="rocky">Rocky planet</button><button id="moon">Moon</button><button id="meteor">Shooting star</button><label>Time of day <input id="hour" type="range" min="0" max="24" value="0" step=".05"></label><label><input id="animate" type="checkbox" checked style="width:auto"> Animate</label><p id="stats"></p></aside><script type="module" src="./night-sky-review.ts"></script></body></html>
